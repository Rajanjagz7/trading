<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b111e"/>
      <stop offset="100%" stop-color="#040711"/>
    </linearGradient>
    <linearGradient id="bullGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="bearGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="trendGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Container Box with Rounded Edges & Glass Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Grid Lines -->
  <line x1="10" y1="32" x2="54" y2="32" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="10" y1="46" x2="54" y2="46" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="10" y1="18" x2="54" y2="18" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Candlestick 1: Bearish Red (Left) -->
  <line x1="20" y1="16" x2="20" y2="48" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  <rect x="15" y="22" width="10" height="18" rx="2" fill="url(#bearGrad)"/>

  <!-- Candlestick 2: Bullish Green (Right) -->
  <line x1="43" y1="10" x2="43" y2="52" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="37" y="16" width="12" height="24" rx="2.5" fill="url(#bullGrad)" filter="url(#neonGlow)"/>

  <!-- Upward Trend Momentum Curve & Arrowhead -->
  <path d="M 8 46 Q 26 40, 36 28 T 54 13" fill="none" stroke="url(#trendGrad)" stroke-width="3" stroke-linecap="round" filter="url(#neonGlow)"/>
  <polygon points="56,12 48,13 52,18" fill="#38bdf8"/>
</svg>
